<!doctype html>
<html lang="bn" class="dark" style="background-color:#0a0a0a;color:#ffffff">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hands &amp; Head HR — Silver Group × Hara International × Vietnam Partner</title>
    <meta
      name="description"
      content="Silver Group (Bangladesh) × Hara International (Japan) × Vietnam Partner tri-national recruitment and deployment portal."
    />
    <meta property="og:title" content="Hands &amp; Head HR — Tri-National Recruitment Portal" />
    <meta
      property="og:description"
      content="Silver Group (Bangladesh) × Hara International (Japan) × Vietnam Partner tri-national recruitment and deployment portal."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hind+Siliguri:wght@600;700&family=Noto+Sans+JP:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#0a0a0a] text-white antialiased selection:bg-[#FF5500] selection:text-black" style="background-color:#0a0a0a;color:#ffffff">
    <div id="root"></div>
    <noscript>
      <div style="padding:24px;font-family:monospace;background:#0a0a0a;color:#FF5500">
        Hands &amp; Head HR requires JavaScript enabled to run.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var bootError = '';
        window.addEventListener(
          'error',
          function (e) {
            if (!bootError) {
              bootError = (e && (e.message || (e.target && e.target.src))) || 'Script load failure';
            }
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          if (!bootError && e && e.reason) {
            bootError = e.reason.message || String(e.reason);
          }
        });
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.childElementCount === 0) {
              root.innerHTML =
                '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0a0a0a;color:#ffffff;font-family:monospace">' +
                '<div style="max-width:560px;width:100%;background:#121212;border:2px solid #FF5500;padding:24px">' +
                '<p style="color:#FF5500;font-weight:bold;margin:0 0 8px 0;font-size:12px">HANDS &amp; HEAD HR — DEPLOYMENT DIAGNOSTIC</p>' +
                '<h1 style="margin:0 0 12px 0;font-size:20px;font-family:sans-serif">Application bundle did not start</h1>' +
                '<p style="color:#A1A1AA;font-size:13px;line-height:1.5;margin:0 0 12px 0">If hosted on GitHub Pages, open Repository Settings &rarr; Pages and set <strong>Source</strong> to <strong>GitHub Actions</strong> so <code>.github/workflows/deploy.yml</code> serves the compiled <code>dist/</code> bundle.</p>' +
                (bootError
                  ? '<p style="color:#e11d48;font-size:12px;word-break:break-word;margin:0">Detail: ' +
                    String(bootError).replace(/[<>&]/g, '') +
                    '</p>'
                  : '') +
                '</div></div>';
            }
          }, 2500);
        });
      })();
    </script>
  </body>
</html>
